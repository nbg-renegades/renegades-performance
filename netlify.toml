# Netlify picks pnpm because pnpm-lock.yaml is committed, and takes the exact version from
# the packageManager field in package.json via corepack - so the version lives in one place
# rather than being pinned again here. Its install is --frozen-lockfile, which is what we
# want: a build should fail rather than quietly resolve something the lockfile does not name.
[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Vite emits content-hashed filenames under /assets, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The app uses BrowserRouter, so every unknown path must fall through to the SPA.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
